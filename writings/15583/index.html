html { background: var(--paper); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  background: var(--paper); color: var(--ink); font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif; }
.gate { box-sizing: border-box; width: 100%; max-width: 432px; padding: 48px 16px; text-align: center; }

h1 { margin: 14px 0 0; font-size: 24px; font-weight: 600; letter-spacing: .14em; }
.rule { width: 48px; height: 1px; margin: 26px auto; background: var(--brass); }
p { margin: 0; line-height: 1.9; }
form { margin-top: 32px; text-align: left; }
label { font-size: 14px; letter-spacing: .08em; color: var(--muted); }
input { display: block; box-sizing: border-box; width: 100%; margin-top: 8px; padding: 12px 14px; font: inherit; font-size: 18px;
  color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 2px; -webkit-appearance: none; appearance: none; }
input:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
button { display: block; width: 100%; margin-top: 20px; padding: 14px; font: inherit; font-size: 16px; letter-spacing: .24em;
  color: #fff; background: var(--navy); border: 0; border-radius: 2px; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.err { min-height: 1.9em; margin-top: 16px; font-size: 15px; color: var(--err); }
